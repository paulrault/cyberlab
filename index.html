
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>CyberLab Academy V7</title>
<style>
:root{
 --bg:#0b1220;--panel:#121d30;--panel2:#192740;--border:#2a3952;
 --text:#eaf1ff;--muted:#99abc5;--accent:#60a5fa;--cyan:#22d3ee;
 --green:#34d399;--orange:#fbbf24;--red:#fb7185;
}
body.light{
 --bg:#edf2f9;--panel:#fff;--panel2:#f2f6fc;--border:#d7e0ed;
 --text:#18253b;--muted:#63738b;--accent:#2563eb;--cyan:#0284c7;
 --green:#059669;--orange:#b45309;--red:#e11d48;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font:14px/1.6 Inter,Segoe UI,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
 outline:2px solid var(--cyan);outline-offset:2px}
.app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
aside{height:100vh;position:sticky;top:0;overflow:auto;background:var(--panel);
 border-right:1px solid var(--border);padding:20px 14px}
.brand{display:flex;align-items:center;gap:11px;padding:4px 7px 22px}
.brand-icon{display:grid;place-items:center;width:42px;height:42px;
 border-radius:13px;background:linear-gradient(135deg,#2563eb,#06b6d4);
 color:white;font-size:23px}
.brand strong{display:block;font-size:16px}
.brand small{color:var(--muted);font-size:11px}
.nav-label{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;
 color:var(--muted);padding:13px 10px 5px}
nav button{display:flex;align-items:center;gap:10px;width:100%;
 background:transparent;border:0;border-radius:9px;color:var(--muted);
 padding:10px;text-align:left;margin:2px 0}
nav button:hover,nav button.active{background:var(--panel2);color:var(--text)}
nav button.active{box-shadow:inset 3px 0 var(--accent)}
.side-progress{margin-top:22px;padding:13px;background:var(--panel2);border-radius:12px}
.small{font-size:12px;color:var(--muted)}
.progress{height:7px;background:var(--border);border-radius:9px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:9px}
main{min-width:0}
header{height:72px;padding:0 28px;border-bottom:1px solid var(--border);
 display:flex;align-items:center;justify-content:space-between;gap:12px}
header h2{font-size:17px;margin:0}
.header-actions{display:flex;align-items:center;gap:8px}
.content{max-width:1500px;margin:auto;padding:26px}
.page-head{display:flex;justify-content:space-between;align-items:center;
 flex-wrap:wrap;gap:14px;margin-bottom:23px}
h1{font-size:27px;line-height:1.25;letter-spacing:-.5px;margin:0 0 5px}
h2.section{font-size:18px;margin:27px 0 13px}
h3{font-size:16px;margin:0 0 9px}
p{margin:5px 0}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--border);
 border-radius:14px;padding:18px;min-width:0}
.stat-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat-icon{font-size:21px;padding:8px;border-radius:10px;background:var(--panel2)}
.stat-number{font-size:27px;font-weight:750;letter-spacing:-.5px;margin-top:8px}
.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);
 border-radius:9px;padding:9px 13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.pill{display:inline-block;border-radius:20px;background:var(--panel2);
 color:var(--muted);font-size:11px;padding:4px 9px}
.pill.good{color:var(--green)}.pill.warn{color:var(--orange)}
.field{display:grid;gap:5px;margin:12px 0}
.field label{color:var(--muted);font-size:12px}
input,select,textarea{width:100%;background:var(--bg);color:var(--text);
 border:1px solid var(--border);border-radius:9px;padding:10px}
textarea{min-height:115px;resize:vertical}
.course-icon{font-size:27px;margin-bottom:8px}
.course-card{display:flex;flex-direction:column;gap:8px}
.course-card .actions{margin-top:auto}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-size:11px}
.table-wrap{overflow:auto}
.terminal{font:13px/1.7 Consolas,monospace;background:#060c16;color:#b8f7cf;
 border:1px solid #27354a;padding:15px;border-radius:10px;min-height:170px;
 white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto}
.quiz-option,.check-row{display:flex;gap:9px;align-items:flex-start;padding:9px;
 border:1px solid var(--border);border-radius:8px;margin:7px 0}
.quiz-option input,.check-row input{width:auto;margin-top:5px}
.question{padding:13px 0;border-bottom:1px solid var(--border)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.toast{display:none;position:fixed;right:18px;bottom:18px;z-index:10;
 max-width:90%;padding:13px 17px;background:var(--panel2);
 border:1px solid var(--border);border-radius:11px;box-shadow:0 8px 28px #0003}
footer{text-align:center;color:var(--muted);font-size:11px;padding:25px 0}
.mobile-menu{display:none}
.search-wrap{max-width:340px;width:100%}
@media(max-width:1050px){
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){
 .app{grid-template-columns:1fr}
 aside{position:fixed;z-index:8;left:-270px;width:250px;transition:left .2s}
 aside.open{left:0}
 .mobile-menu{display:inline-block}
 header{padding:0 13px}
 .content{padding:18px 12px}
 .grid,.grid.two,.grid.three{grid-template-columns:1fr}
 h1{font-size:23px}
 .search-wrap{max-width:150px}
}
</style>
</head>
<body>
<div class="app">
<aside id="sidebar">
 <div class="brand">
  <div class="brand-icon">⌘</div>
  <div><strong>CyberLab Academy</strong><small>V7 · IT Learning Center</small></div>
 </div>
 <nav id="navigation">
  <div class="nav-label">Vue générale</div>
  <button class="active" data-page="dashboard">▦ Tableau de bord</button>
  <button data-page="courses">▤ Formations</button>
  <button data-page="missions">⚑ Missions</button>
  <button data-page="quiz">✎ Quiz et examens blancs</button>
  <div class="nav-label">Laboratoire</div>
  <button data-page="network">⌘ Calculateur IP</button>
  <button data-page="terminal">› Terminal simulé</button>
  <button data-page="monitoring">◉ Supervision</button>
  <button data-page="troubleshooting">⚒ Dépannage</button>
  <div class="nav-label">Documentation</div>
  <button data-page="glossary">▧ Glossaire</button>
  <button data-page="journal">▣ Carnet de bord</button>
  <button data-page="settings">⚙ Paramètres</button>
 </nav>
 <div class="side-progress">
  <strong>🎓 Progression</strong>
  <p id="sideLevel" class="small">Niveau 1 · Débutant</p>
  <div class="progress"><span id="sideBar" style="width:0%"></span></div>
  <p id="sideXP" class="small">0 XP</p>
 </div>
</aside>
<main>
 <header>
  <div class="row-between" style="justify-content:flex-start">
   <button class="btn mobile-menu" id="menuButton" aria-label="Ouvrir le menu">☰</button>
   <h2 id="pageTitle">Tableau de bord</h2>
  </div>
  <div class="header-actions">
   <div class="search-wrap"><input id="globalSearch" placeholder="Rechercher..." aria-label="Recherche globale"></div>
   <button class="btn" id="themeButton" aria-label="Changer de thème">☀</button>
  </div>
 </header>
 <section class="content" id="content"></section>
</main>
</div>
<div id="toast" class="toast" role="status"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
const initialState={
 xp:0,lessons:[],missions:[],quizHistory:[],notes:[],
 theme:"dark",quizBest:0,missionChecks:{},troubleHistory:[]
};
function loadState(){
 try{
  const raw=JSON.parse(localStorage.getItem("cla-v7"));
  if(!raw||typeof raw!=="object")return {...initialState};
  return {...initialState,...raw,
   lessons:Array.isArray(raw.lessons)?raw.lessons:[],
   missions:Array.isArray(raw.missions)?raw.missions:[],
   notes:Array.isArray(raw.notes)?raw.notes:[],
   quizHistory:Array.isArray(raw.quizHistory)?raw.quizHistory:[],
   missionChecks:raw.missionChecks&&typeof raw.missionChecks==="object"?raw.missionChecks:{}
  };
 }catch{return {...initialState};}
}
let state=loadState(),page="dashboard",activeCourse=null,quiz=null;
let activeTrouble=null;
function save(){
 try{localStorage.setItem("cla-v7",JSON.stringify(state));}
 catch{notify("Le navigateur ne peut pas enregistrer les données.");}
}
function notify(msg){
 const el=$("#toast");el.textContent=msg;el.style.display="block";
 clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.style.display="none",2700);
}
function level(){return Math.floor(state.xp/250)+1}
function levelTitle(){
 return ["Débutant","Technicien junior","Technicien confirmé","Administrateur junior",
 "Administrateur confirmé","Expert"][Math.min(level()-1,5)];
}
function updateStats(){
 const n=state.xp%250;
 $("#sideLevel").textContent=`Niveau ${level()} · ${levelTitle()}`;
 $("#sideXP").textContent=`${state.xp} XP · ${250-n} XP avant le prochain niveau`;
 $("#sideBar").style.width=n/250*100+"%";
}
function award(xp,msg){
 state.xp+=xp;save();updateStats();notify(`+${xp} XP — ${msg}`);
}
const courses=[
 {id:"win",icon:"🪟",name:"Windows Server",level:"Débutant",desc:"Active Directory, DNS, DHCP, GPO et partages.",
  lessons:[
   ["Active Directory","AD DS centralise les comptes, groupes, ordinateurs et ressources d'un domaine Windows."],
   ["Utilisateurs et groupes","Créer des comptes et organiser les droits à l'aide de groupes adaptés."],
   ["DNS et DHCP","DNS assure la résolution des noms ; DHCP distribue les paramètres IP."],
   ["GPO et permissions","Les stratégies de groupe appliquent des paramètres. Les permissions doivent respecter le moindre privilège."]
  ]},
 {id:"deb",icon:"🐧",name:"Debian et Linux",level:"Débutant",desc:"Commandes, utilisateurs, services et journaux.",
  lessons:[
   ["Commandes essentielles","pwd affiche le dossier courant, ls liste les fichiers et cd change de répertoire."],
   ["Utilisateurs et permissions","Les droits Linux distinguent propriétaire, groupe et autres."],
   ["Services systemd","systemctl permet d'inspecter les services gérés par systemd."],
   ["Journaux système","journalctl aide à examiner les événements et les erreurs."]
  ]},
 {id:"net",icon:"🌐",name:"Réseaux TCP/IP",level:"Intermédiaire",desc:"IPv4, CIDR, VLAN, routage, DNS et DHCP.",
  lessons:[
   ["Adressage IPv4","IPv4 utilise 32 bits. Le préfixe CIDR définit la partie réseau."],
   ["Sous-réseaux","Le masque permet de déterminer le réseau et la plage d'adresses."],
   ["VLAN et commutation","Les VLAN segmentent logiquement un réseau de niveau 2."],
   ["Routage","Un routeur achemine les paquets entre réseaux IP."]
  ]},
 {id:"sec",icon:"🛡️",name:"Cybersécurité",level:"Intermédiaire",desc:"Durcissement, pare-feu, sauvegardes et journaux.",
  lessons:[
   ["Moindre privilège","Les comptes disposent uniquement des droits nécessaires."],
   ["Sauvegardes fiables","Il faut protéger les sauvegardes et tester régulièrement leur restauration."],
   ["Pare-feu","Les règles doivent autoriser uniquement les flux nécessaires."],
   ["Gestion des incidents","Documenter les symptômes, préserver les informations utiles et suivre les procédures."]
  ]},
 {id:"virt",icon:"🖥️",name:"Virtualisation",level:"Intermédiaire",desc:"Hyperviseurs, VM, réseaux virtuels et sauvegardes.",
  lessons:[
   ["Hyperviseurs","Ils fournissent les ressources virtuelles nécessaires aux machines virtuelles."],
   ["Réseaux virtuels","Les réseaux virtuels connectent les VM selon la topologie configurée."],
   ["Ressources VM","CPU, RAM, stockage et réseau doivent être dimensionnés."],
   ["Snapshots et sauvegardes","Un snapshot ne remplace pas une sauvegarde indépendante."]
  ]},
 {id:"dock",icon:"🐳",name:"Docker et services",level:"Intermédiaire",desc:"Conteneurs, volumes, ports et diagnostic.",
  lessons:[
   ["Images et conteneurs","Une image sert de modèle à la création d'un conteneur."],
   ["Ports et volumes","Les ports exposent un service ; les volumes conservent les données."],
   ["Logs et état","L'état, les journaux et la configuration permettent de diagnostiquer un conteneur."],
   ["Mises à jour","Prévoir une sauvegarde et une procédure de retour arrière avant une mise à jour."]
  ]},
 {id:"super",icon:"📈",name:"Supervision IT",level:"Intermédiaire",desc:"Disponibilité, métriques, alertes et documentation.",
  lessons:[
   ["Indicateurs","CPU, mémoire, disque, disponibilité et latence donnent des indices sur l'état d'un service."],
   ["Seuils et alertes","Les seuils doivent être adaptés au contexte pour limiter les alertes inutiles."],
   ["Analyse des journaux","Comparer les événements avec l'heure de début de l'incident."],
   ["Compte rendu","Documenter l'impact, les vérifications, la résolution et les actions préventives."]
  ]}
];
const missions=[
 {id:"ad",title:"Créer un compte de domaine",cat:"Windows Server",xp:50,
 desc:"Préparer un compte de test et vérifier ses permissions.",
 steps:["Identifier la bonne unité d'organisation.","Créer un compte de test avec un nom explicite.","Ajouter le compte au groupe prévu.","Vérifier les permissions et documenter le résultat."]},
 {id:"dns",title:"Diagnostiquer une panne DNS",cat:"Réseau",xp:60,
 desc:"Un poste accède à une adresse IP mais ne résout plus les noms.",
 steps:["Vérifier l'adresse IP, le masque et la passerelle.","Vérifier le serveur DNS configuré.","Tester la résolution avec nslookup.","Consulter les journaux et consigner la conclusion."]},
 {id:"dhcp",title:"Analyser un problème DHCP",cat:"Réseau",xp:60,
 desc:"Un poste ne reçoit pas la configuration réseau attendue.",
 steps:["Contrôler l'état de l'interface réseau.","Vérifier le réseau local et le VLAN.","Contrôler l'étendue et les baux DHCP dans le lab.","Documenter le diagnostic et la correction prévue."]},
 {id:"backup",title:"Contrôler une sauvegarde",cat:"Sécurité",xp:75,
 desc:"Vérifier qu'une sauvegarde permet réellement de restaurer des données.",
 steps:["Identifier le jeu de sauvegarde attendu.","Contrôler sa date et le résultat du job.","Restaurer un fichier de test dans un emplacement séparé.","Noter le résultat et les actions correctives."]},
 {id:"linux",title:"Diagnostiquer un service Linux",cat:"Linux",xp:50,
 desc:"Un service fictif ne démarre plus.",
 steps:["Consulter l'état du service avec systemctl.","Lire les journaux associés.","Vérifier configuration, permissions et dépendances.","Rédiger une conclusion et une proposition de correction."]},
 {id:"docker",title:"Conteneur indisponible",cat:"Docker",xp:75,
 desc:"Une application conteneurisée n'est plus accessible.",
 steps:["Vérifier l'état du conteneur.","Consulter les journaux.","Contrôler les ports et la connectivité.","Vérifier les volumes et documenter les constats."]},
 {id:"vlan",title:"Préparer un VLAN de test",cat:"Réseau",xp:80,
 desc:"Concevoir une segmentation logique pour deux groupes de machines.",
 steps:["Définir les besoins de séparation.","Choisir des identifiants VLAN et un plan IP.","Déterminer le routage nécessaire entre VLAN.","Prévoir des tests de connectivité et de filtrage."]},
 {id:"monitor",title:"Analyser une alerte de supervision",cat:"Supervision",xp:60,
 desc:"Un serveur fictif présente une charge CPU élevée.",
 steps:["Vérifier la durée et l'évolution de l'alerte.","Comparer CPU, mémoire et activité des services.","Examiner les journaux autour de l'incident.","Documenter l'impact et les vérifications complémentaires."]}
];
const questions=[
 {q:"Quel service gère les identités dans un domaine Windows ?",a:["DHCP","AD DS","NAT","NTP"],c:1,e:"AD DS centralise les identités et les ressources d'un domaine."},
 {q:"Quel service attribue automatiquement les paramètres IP ?",a:["DNS","SSH","DHCP","SNMP"],c:2,e:"DHCP distribue l'adresse IP et d'autres paramètres réseau."},
 {q:"À quoi sert DNS ?",a:["À résoudre des noms","À chiffrer un disque","À créer un VLAN","À sauvegarder une VM"],c:0,e:"DNS permet notamment de résoudre les noms en informations réseau."},
 {q:"Que signifie le préfixe /24 ?",a:["24 hôtes","24 bits de préfixe réseau","24 VLAN","24 routeurs"],c:1,e:"Un préfixe /24 réserve 24 bits à la partie réseau."},
 {q:"Quelle commande Linux affiche les interfaces et adresses IP ?",a:["ip addr","mkdir","whoami","shutdown"],c:0,e:"ip addr affiche les interfaces et leurs adresses."},
 {q:"Quel principe limite les droits des comptes ?",a:["Compte partagé","Administrateur partout","Moindre privilège","Désactiver les mises à jour"],c:2,e:"Le moindre privilège limite les permissions au besoin réel."},
 {q:"Un snapshot remplace-t-il une sauvegarde ?",a:["Toujours","Non","Seulement sous Linux","Seulement en production"],c:1,e:"Un snapshot dépend généralement du stockage et de l'environnement d'origine."},
 {q:"Quel équipement route entre réseaux IP ?",a:["Clavier","Routeur","Écran","Point d'accès uniquement"],c:1,e:"Un routeur achemine les paquets entre réseaux."},
 {q:"Quel outil aide à consulter les journaux systemd ?",a:["journalctl","format","ping uniquement","mkdir"],c:0,e:"journalctl permet de consulter les journaux du système."},
 {q:"À quoi sert un volume Docker ?",a:["À conserver des données","À remplacer le DNS","À chiffrer tout le réseau","À créer un VLAN"],c:0,e:"Les volumes permettent de conserver les données des conteneurs."},
 {q:"Quel est le rôle d'un pare-feu ?",a:["Créer les comptes","Filtrer les flux réseau","Attribuer des IP automatiquement","Remplacer les sauvegardes"],c:1,e:"Un pare-feu autorise ou bloque les flux selon des règles."},
 {q:"Que signifie RTO ?",a:["Durée cible de rétablissement","Adresse du routeur","Type de VLAN","Journal DNS"],c:0,e:"Le RTO est l'objectif de temps de rétablissement d'un service."},
 {q:"Quel protocole est conçu pour l'administration distante sécurisée ?",a:["FTP non chiffré","SSH","Telnet","HTTP seul"],c:1,e:"SSH permet notamment une administration distante chiffrée."},
 {q:"Que fait un VLAN ?",a:["Segmente logiquement le réseau","Augmente la RAM","Remplace le routeur dans tous les cas","Crée une sauvegarde"],c:0,e:"Un VLAN forme un domaine logique de niveau 2."},
 {q:"Que vérifier avant de modifier un service en production ?",a:["Rien","Uniquement le nom","Impact, sauvegarde et procédure de retour arrière","Supprimer les logs"],c:2,e:"Il faut anticiper l'impact, préserver les données et préparer le retour arrière."}
];
const glossary=[
 ["AD DS","Service de gestion centralisée des identités d'un domaine Windows."],
 ["DHCP","Protocole d'attribution automatique des paramètres réseau."],
 ["DNS","Système de résolution de noms."],
 ["VLAN","Segmentation logique d'un réseau de niveau 2."],
 ["CIDR","Notation d'un préfixe réseau, par exemple /24."],
 ["RTO","Objectif de durée pour rétablir un service."],
 ["RPO","Perte maximale de données acceptable exprimée en durée."],
 ["NTFS","Système de fichiers Windows prenant en charge des permissions."],
 ["SSH","Protocole sécurisé d'administration distante."],
 ["NAT","Traduction d'adresses réseau."],
 ["Hyperviseur","Système qui exécute et gère des machines virtuelles."],
 ["Conteneur","Environnement isolé pour exécuter une application."],
 ["SIEM","Outil de centralisation et d'analyse d'événements de sécurité."],
 ["Supervision","Surveillance de la disponibilité, des performances et des alertes."],
 ["Moindre privilège","Attribution des seuls droits nécessaires à une tâche."],
 ["GPO","Stratégie de groupe Windows qui applique des paramètres."],
 ["SNMP","Protocole couramment utilisé pour superviser des équipements."],
 ["Pare-feu","Système de filtrage des flux réseau."]
];
function progress(c){
 const n=c.lessons.filter((_,i)=>state.lessons.includes(c.id+":"+i)).length;
 return {n,total:c.lessons.length,pct:Math.round(n/c.lessons.length*100)};
}
function head(title,sub,extra=""){
 return `<div class="page-head"><div><h1>${title}</h1><p class="muted">${sub}</p></div>${extra}</div>`;
}
function stat(icon,label,value,desc){
 return `<article class="card"><div class="stat-top"><span class="muted">${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-number">${value}</div><p class="small">${desc}</p></article>`;
}
function dashboard(){
 const total=courses.reduce((n,c)=>n+c.lessons.length,0);
 const pct=Math.round(state.lessons.length/total*100);
 return head("Centre de contrôle","Bienvenue sur ton espace d'apprentissage SISR.")+
 `<div class="grid">
 ${stat("⚡","Expérience",state.xp+" XP","Progression personnelle")}
 ${stat("📚","Leçons",state.lessons.length+"/"+total,pct+" % du programme")}
 ${stat("⚑","Missions",state.missions.length+"/"+missions.length,"Missions validées")}
 ${stat("🎯","Meilleur quiz",(state.quizBest||0)+"%","Meilleur score enregistré")}
 </div>
 <h2 class="section">Reprendre la formation</h2>
 <div class="grid three">${courses.slice(0,3).map(c=>courseCard(c)).join("")}</div>
 <h2 class="section">Accès rapide</h2>
 <div class="grid three">

function ipNumber(ip){
 const p=ip.split(".");
 if(p.length!==4||p.some(x=>!/^\d{1,3}$/.test(x)||Number(x)>255))return null;
 return p.reduce((a,x)=>a*256+Number(x),0)>>>0;
}
function ipString(n){return [n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join(".")}
function calculate(ip,prefix){
 const n=ipNumber(ip),p=Number(prefix);
 if(n===null)return {error:"Adresse IPv4 invalide."};
 const mask=p===0?0:(0xffffffff<<(32-p))>>>0;
 const net=(n&mask)>>>0,bcast=(net|(~mask))>>>0;
 const total=2**(32-p);
 let first=net,last=bcast,hosts=total;
 if(p<=30){first=net+1;last=bcast-1;hosts=total-2}
 else if(p===31){hosts=2}
 else hosts=1;
 return {ip,mask:ipString(mask),net:ipString(net),bcast:ipString(bcast),
 first:ipString(first),last:ipString(last),total,hosts,p};
}
function showIP(r){

 ["Adresses totales","total"],["Hôtes utilisables","hosts"]];
 return `<div class="grid two">${entries.map(([label,key])=>`<div class="card"><span class="small">${label}</span><div style="font-size:18px;font-weight:700;overflow-wrap:anywhere">${typeof r[key]==="number"?r[key].toLocaleString("fr-FR"):r[key]}</div></div>`).join("")}</div><p class="small" style="margin-top:12px">Les préfixes /31 et /32 ont des usages particuliers. Vérifie toujours le contexte réseau avant d'appliquer un plan d'adressage.</p>`;
}

function runCommand(cmd){
 const out=$("#termOut");if(!out)return;
 cmd=cmd.trim();if(!cmd)return;
 if(cmd==="clear"){out.textContent="CyberLab Academy V7 — simulation pédagogique\n$ ";return}
 const results={
  help:"Commandes disponibles : help, ipconfig, ip addr, ip route, ping <IP>, clear",
  ipconfig:"Ethernet (simulation)\nIPv4 : 192.168.10.25\nMasque : 255.255.255.0\nPasserelle : 192.168.10.254\nDNS : 192.168.10.10",
  "ip addr":"2: eth0: <UP>\n    inet 192.168.10.25/24",
  "ip route":"default via 192.168.10.254 dev eth0\n192.168.10.0/24 dev eth0"
 };
 let result=results[cmd];
 if(!result&&/^ping\s+[\d.]+$/.test(cmd))result="Ping fictif : aucune requête réelle n'a été envoyée.\nRésultat pédagogique simulé : 4 réponses, 0 % de perte.";
 if(!result)result="Commande non prise en charge. Tape help.";
 out.textContent+=cmd+"\n"+result+"\n$ ";out.scrollTop=out.scrollHeight;
}

function importData(){
 const file=$("#importFile")?.files?.[0];
 if(!file){notify("Choisis un fichier JSON.");return}
 if(file.size>2*1024*1024){notify("Fichier trop volumineux (2 Mo maximum).");return}
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const parsed=JSON.parse(reader.result),s=parsed.state;
   if(!s||!Number.isFinite(s.xp)||s.xp<0||!Array.isArray(s.lessons)||!Array.isArray(s.missions)||!Array.isArray(s.notes)||!Array.isArray(s.quizHistory))throw Error();
   if(!confirm("Remplacer les données actuelles par cette sauvegarde ?"))return;
   state={...initialState,...s};
   state.xp=Math.floor(state.xp);
   state.lessons=state.lessons.filter(x=>typeof x==="string");
   state.missions=state.missions.filter(x=>typeof x==="string");
   state.notes=state.notes.filter(n=>n&&typeof n.title==="string"&&typeof n.text==="string").slice(-200);
   state.quizHistory=state.quizHistory.filter(x=>x&&Number.isFinite(x.score)).slice(-50);
   save();applyTheme();go("dashboard");notify("Sauvegarde importée.");
  }catch{notify("Fichier invalide ou incompatible.");}
 };
 reader.readAsText(file);
}

 if(b.dataset.toggleServer){
  const n=b.dataset.toggleServer;
  if(simulatedDown.has(n))simulatedDown.delete(n);else simulatedDown.add(n);
  render();return;
 }
 if(b.dataset.trouble){
  activeTrouble=b.dataset.trouble;
  state.missionChecks["trouble:"+activeTrouble]=[];
  go("troubleshooting");activeTrouble=b.dataset.trouble;render();return;
 }
 if(b.hasAttribute("data-back-troubles")){activeTrouble=null;render();return}
 if(b.dataset.troubleAnswer){
  const t=troubles.find(x=>x.id===b.dataset.troubleAnswer);
  $("#troubleAnswer").innerHTML=`<div class="card" style="margin-top:15px"><h3>Synthèse pédagogique</h3><p>${t.answer}</p><p class="small">Cette synthèse est un point de départ. En situation réelle, confirme toujours la cause avant d'appliquer une correction.</p></div>`;
  return;
 }
 if(b.dataset.setTheme){
  state.theme=b.dataset.setTheme;save();applyTheme();notify("Thème modifié.");return;
 }
 if(b.hasAttribute("data-export")){exportData();return}
 if(b.hasAttribute("data-import")){importData();return}
 if(b.hasAttribute("data-reset")){
  if(confirm("Effacer la progression, les notes et l'historique de quiz ?")){
   state={...initialState};save();applyTheme();page="dashboard";activeCourse=null;quiz=null;render();notify("Données réinitialisées.");
  }return;
 }
 if(b.dataset.deleteNote){
  state.notes=state.notes.filter(n=>String(n.id)!==b.dataset.deleteNote);save();render();notify("Note supprimée.");
 }
});
$("#content").addEventListener("change",e=>{
 const el=e.target;
 if(el.dataset.check){
  const [id,index]=el.dataset.check.split(":");const i=Number(index);
  const set=new Set(state.missionChecks[id]||[]);
  if(el.checked)set.add(i);else set.delete(i);
  state.missionChecks[id]=[...set];save();render();return;
 }
 if(el.dataset.troubleCheck){
  const [id,index]=el.dataset.troubleCheck.split(":");const key="trouble:"+id,i=Number(index);
  const set=new Set(state.missionChecks[key]||[]);
  if(el.checked)set.add(i);else set.delete(i);
  state.missionChecks[key]=[...set];save();render();return;
 }
});
$("#content").addEventListener("submit",e=>{
 e.preventDefault();
 if(e.target.id==="ipForm"){
  $("#ipResult").innerHTML=showIP(calculate($("#ip").value.trim(),$("#prefix").value));return;
 }
 if(e.target.id==="termForm"){
  runCommand($("#termInput").value);$("#termInput").value="";return;
 }
 if(e.target.id==="quizForm"){submitQuiz(e.target);return}
 if(e.target.id==="noteForm"){
  const title=$("#noteTitle").value.trim(),text=$("#noteText").value.trim();
  if(!title||!text)return;
  state.notes.push({id:Date.now(),title,text,date:new Date().toLocaleString("fr-FR")});
  state.notes=state.notes.slice(-200);save();render();notify("Note enregistrée.");return;
 }
});
$("#content").addEventListener("input",e=>{
 if(e.target.id==="glossSearch"){
  const q=e.target.value.toLowerCase().trim();
  $$(".gloss-item").forEach(el=>el.style.display=el.dataset.search.includes(q)?"":"none");
 }
});
function init(){
 if(!["light","dark"].includes(state.theme))state.theme="dark";
 applyTheme();render();
}
init();
</script>
</body>
</html>
